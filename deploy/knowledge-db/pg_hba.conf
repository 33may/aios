# PostgreSQL Client Authentication Configuration
# Allow connections from local network

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Docker network
host    all             all             172.16.0.0/12           scram-sha-256

# Local network (adjust to your network range)
host    knowledge_graph knowledge       192.168.0.0/16          scram-sha-256
host    knowledge_graph knowledge       10.0.0.0/8              scram-sha-256

# For Tailscale/VPN (100.x.x.x range)
host    knowledge_graph knowledge       100.64.0.0/10           scram-sha-256
